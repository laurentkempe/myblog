allowBuilds:
  '@tailwindcss/oxide': false
  esbuild: true
  sharp: true

# Remove once Vite's resolved optional peer no longer selects vulnerable yaml versions.
minimumReleaseAgeExclude:
  - '@astrojs/markdown-remark@7.3.9'
  - '@astrojs/markdown-satteri@0.4.10'
  - '@astrojs/mdx@8.1.6'
  - '@astrojs/sitemap@3.7.5'
  - '@astrojs/vite-plugin-astro@0.1.3'
  - astro@7.4.12

overrides:
  yaml: 2.8.3
